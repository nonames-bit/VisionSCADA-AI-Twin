version: "3.9"

# docker compose up -d   ->   Postgres/Timescale, MQTT, Ignition, MinIO (S3), MLflow
#   MinIO console : http://localhost:9090   (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD from .env)
#   MLflow UI     : http://localhost:5000   (also embedded in the Ignition Perspective MLOps view)

services:
  postgres-vision:
    image: timescale/timescaledb:latest-pg16
    container_name: twin-timescaledb
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: vision_scada
    ports:
      - "5432:5432"
    restart: unless-stopped

  mosquitto-uns:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped

  ignition-scada:
    image: ignition-cloud:8.3.3
    container_name: twin-ignition
    ports:
      - "8089:8088"
      - "8043:8043"
    extra_hosts:
      # gateway scripts reach the Python backend (server.py on the host) as host.docker.internal:8020
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---- S3-compatible object storage (free, local): DVC dataset remote + MLflow artifacts ----
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: twin-minio
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # S3 API (DVC remote s3://dvc-store, endpoint http://localhost:9000)
      - "9090:9090"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: twin-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/dvc-store &&
        mc mb --ignore-existing local/mlflow &&
        mc version enable local/dvc-store
    restart: "no"

  # ---- MLflow tracking server + Model Registry (free, self-hosted) ----
  mlflow:
    build: ./docker/mlflow
    image: visionscada/mlflow:3.18.0
    container_name: twin-mlflow
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      PG_HOST: twin-timescaledb
      PG_ADMIN_USER: twin
      PG_ADMIN_PASS: change_me
      MLFLOW_DB: mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # let the MLflow UI load inside the Ignition Perspective iframe (localhost:8089)
      MLFLOW_SERVER_X_FRAME_OPTIONS: "NONE"
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000,host.docker.internal,host.docker.internal:5000"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://localhost:8089,http://127.0.0.1:8089,http://localhost:8020,http://127.0.0.1:8020"
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  minio-data:

networks:
  default:
    name: digitaltiwn_twin-net
    external: true
