  <style>

<body>
  <canvas id="canvas3d"></canvas>
  <div id="vignette"></div>
  <div id="loading">Generando celda 3D…</div>
  <div id="errbox"></div>
  <div class="hud-top">
    <div class="hud-card">
      <strong>CELDA 3D AOI — SOFT-PLC FIFO TRACKING</strong>
      <span id="hudRecipe" class="hud-badge ok">CAST_100</span>
      <div style="margin-top:4px; color:#94a3b8;">
        Encoder: <span id="hudEncoder" style="color:#38bdf8;">0.0</span> mm |

        ⚡ <strong>Edge Decision:</strong> <span id="hudEdgeMs" style="color:#34d399; font-weight:700;">14.2 ms</span>
        vs ☁️ <strong>Cloud Async:</strong> <span id="hudCloudMs" style="color:#fbbf24; font-weight:700;">840 ms</span>
      </div>
      <div style="margin-top:4px;">
        Última Pieza: <span id="hudSerial" style="color:#e2e8f0; font-weight:600;">--</span>

  </div>
  <div id="toast"></div>
  <div class="hud-bottom">
    <div class="hud-hint">Arrastra para orbitar · R órbita automática <span id="hintState" style="color:#64748b;">OFF</span> · Q calidad</div>
    <button id="qualityBtn" class="hud-btn" type="button">Calidad: Alta</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

    // =====================================================================
    // Layout constants (1 unit ≈ 1 m). PLC positions: camera 300 mm, pusher 1100 mm
    // =====================================================================
    const BELT_TOP = 0.95;
    const BELT_HALF_LEN = 3.5;
    const BELT_HALF_W = 0.5;
    const CAMERA_X = -1.6;
    const PUSHER_X = 1.85;
    const MM_TO_UNITS = (PUSHER_X - CAMERA_X) / 800.0;   // 800 mm between camera and pusher
    const mmToX = mm => CAMERA_X + (mm - 300.0) * MM_TO_UNITS;
    const REJECT_BIN = { x: PUSHER_X, z: 1.36, w: 0.95, h: 0.62, d: 0.82 };
    const OK_BIN = { x: 4.12, z: 0.0, w: 0.82, h: 0.62, d: 1.1 };

    // =====================================================================
    // Renderer, scene, camera
    // =====================================================================
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

    const HALL_COLOR = 0x2e333a;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(HALL_COLOR);
    scene.fog = new THREE.Fog(HALL_COLOR, 10, 36);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 120);
    camera.position.set(3.6, 3.3, 6.9);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.5, 0.95, 0.15);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 1.5;
    controls.maxDistance = 18;
    controls.autoRotateSpeed = 0.6;
    const hintState = document.getElementById('hintState');
    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
      hintState.textContent = controls.autoRotate ? 'ON' : 'OFF';
      hintState.style.color = controls.autoRotate ? '#34d399' : '#64748b';
    }

    // =====================================================================
    // Procedural texture toolkit (tileable noise → color / roughness / normal)
    // =====================================================================
    function makeNoise(seed) {
      let s = seed >>> 0 || 1;
      const rnd = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
      const perm = new Uint16Array(512);
      const vals = new Float32Array(256);
      for (let i = 0; i < 256; i++) { perm[i] = i; vals[i] = rnd(); }
      for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
      for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
      const h = (a, b) => vals[perm[perm[a & 255] + (b & 255)]];
      return function (x, y, px, py) {
        const xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py;
        const x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = h(x0, y0) + (h(x1, y0) - h(x0, y0)) * u;
        const b = h(x0, y1) + (h(x1, y1) - h(x0, y1)) * u;
        return a + (b - a) * v;
      };
    }
    const noiseA = makeNoise(1337), noiseB = makeNoise(4242);
    function fbm(n, u, v, px, py, oct) {
      let amp = 0.5, f = 1, sum = 0, norm = 0;
      for (let o = 0; o < oct; o++) {
        sum += amp * n(u * px * f, v * py * f, px * f, py * f);
        norm += amp; amp *= 0.5; f *= 2;
      }
      return sum / norm;
    }
    function field(w, h, fn) {
      const out = new Float32Array(w * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out[y * w + x] = fn(x / w, y / h, x, y);
      return out;
    }
    function dataTex(w, h, fill, srgb) {
      const data = new Uint8Array(w * h * 4);
      fill(data);
      const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.magFilter = THREE.LinearFilter;
      t.minFilter = THREE.LinearMipmapLinearFilter;
      t.generateMipmaps = true;
      t.anisotropy = MAX_ANISO;
      t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      t.needsUpdate = true;
      return t;
    }
    function grayTex(w, h, f, lo, hi) {
      return dataTex(w, h, d => {
        for (let i = 0; i < w * h; i++) {
          const v = Math.max(0, Math.min(255, Math.round((lo + (hi - lo) * f[i]) * 255)));
          d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
        }
      }, false);
    }
    function colorTex(w, h, f, c0, c1) {
      const a = new THREE.Color(c0), b = new THREE.Color(c1);
      a.convertLinearToSRGB(); b.convertLinearToSRGB();
      return dataTex(w, h, d => {
        for (let i = 0; i < w * h; i++) {
          const t = f[i];
          d[i * 4] = Math.round((a.r + (b.r - a.r) * t) * 255);
          d[i * 4 + 1] = Math.round((a.g + (b.g - a.g) * t) * 255);
          d[i * 4 + 2] = Math.round((a.b + (b.b - a.b) * t) * 255);
          d[i * 4 + 3] = 255;
        }
      }, true);
    }
    function normalTex(w, h, f, strength) {
      return dataTex(w, h, d => {
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          const l = f[y * w + ((x - 1 + w) % w)], r = f[y * w + ((x + 1) % w)];
          const u = f[((y - 1 + h) % h) * w + x], b = f[((y + 1) % h) * w + x];
          let nx = (l - r) * strength, ny = (u - b) * strength, nz = 1;
          const len = Math.hypot(nx, ny, nz);
          nx /= len; ny /= len; nz /= len;
          const i = (y * w + x) * 4;
          d[i] = Math.round((nx * 0.5 + 0.5) * 255);
          d[i + 1] = Math.round((ny * 0.5 + 0.5) * 255);
          d[i + 2] = Math.round((nz * 0.5 + 0.5) * 255);
          d[i + 3] = 255;
        }
      }, false);
    }
    function canvasTex(w, h, draw, srgb = true) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      draw(ctx, w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      t.anisotropy = MAX_ANISO;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      return t;
    }
    const withRepeat = (t, rx, ry) => { const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; };

    // --- Epoxy floor (mottled color, scuffed roughness, faint relief)
    const FLOOR_N = 512;
    const floorMottle = field(FLOOR_N, FLOOR_N, (u, v) => fbm(noiseA, u, v, 6, 6, 5));
    const floorRoughF = field(FLOOR_N, FLOOR_N, (u, v) => {
      const base = fbm(noiseB, u, v, 10, 10, 4);
      const streak = fbm(noiseA, u, v, 3, 48, 3);   // tyre / trolley streaks
      return Math.min(1, base * 0.6 + Math.max(0, streak - 0.55) * 1.6);
    });
    (function scratches() {
      let s = 99;
      const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
      for (let k = 0; k < 160; k++) {
        const x = rnd() * FLOOR_N, y = rnd() * FLOOR_N;
        const a = rnd() * Math.PI, len = 10 + rnd() * 60;
        for (let t = 0; t < len; t++) {
          const xi = ((Math.round(x + Math.cos(a) * t) % FLOOR_N) + FLOOR_N) % FLOOR_N;
          const yi = ((Math.round(y + Math.sin(a) * t) % FLOOR_N) + FLOOR_N) % FLOOR_N;
          floorRoughF[yi * FLOOR_N + xi] = Math.min(1, floorRoughF[yi * FLOOR_N + xi] + 0.45);
        }
      }
    })();
    const floorColor = colorTex(FLOOR_N, FLOOR_N, floorMottle, 0x50565c, 0x6c727a);
    const floorRough = grayTex(FLOOR_N, FLOOR_N, floorRoughF, 0.22, 0.75);
    const floorNormal = normalTex(FLOOR_N, FLOOR_N, field(FLOOR_N, FLOOR_N, (u, v) => fbm(noiseB, u, v, 32, 32, 3)), 1.2);

    // --- Brushed metal roughness (streaks along U)
    const brushedF = field(256, 256, (u, v) => fbm(noiseA, u, v, 2, 128, 3));
    const brushedRough = grayTex(256, 256, brushedF, 0.22, 0.48);

    // --- Powder-coat "orange peel"
    const peelNormal = normalTex(256, 256, field(256, 256, (u, v) => fbm(noiseB, u, v, 24, 24, 3)), 1.6);

    // --- Cast iron (sand-cast grain)
    const castF = field(256, 256, (u, v) => fbm(noiseA, u, v, 48, 48, 4));
    const castNormal = normalTex(256, 256, castF, 5.0);
    const castRough = grayTex(256, 256, castF, 0.55, 0.9);

    // --- Conveyor belt rubber (fine cross texture + one splice per loop)
    const BELT_TEX_W = 512, BELT_TEX_H = 128;
    const beltF = field(BELT_TEX_W, BELT_TEX_H, (u, v, x, y) => {
      const ribs = 0.5 + 0.5 * Math.sin((x + y) * 0.9) * Math.sin((x - y) * 0.9);
      const splice = Math.abs(u - 0.5) < 0.004 ? 0.0 : 1.0;
      return ribs * 0.35 + fbm(noiseB, u, v, 16, 4, 3) * 0.65 * splice;
    });
    const beltColorTex = colorTex(BELT_TEX_W, BELT_TEX_H, beltF, 0x131416, 0x26282c);
    const beltNormalTex = normalTex(BELT_TEX_W, BELT_TEX_H, beltF, 2.5);

    // --- Corrugated wall cladding
    const wallF = field(64, 64, (u) => 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * 4));
    const wallNormal = normalTex(64, 64, wallF, 3.0);

    // --- Hazard tape
    const hazardTex = canvasTex(256, 64, (ctx, w, h) => {
      ctx.fillStyle = '#e3b008'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#16181b';
      const step = 64;
      for (let x = -h; x < w + h; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, h); ctx.lineTo(x + step / 2, h); ctx.lineTo(x + step / 2 + h, 0); ctx.lineTo(x + h, 0);
        ctx.closePath(); ctx.fill();
      }
      for (let i = 0; i < 500; i++) {
        ctx.fillStyle = 'rgba(90,90,90,' + (Math.random() * 0.25) + ')';
        ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1);
      }
    });

    // --- Welded wire mesh for fence panels
    const meshTex = canvasTex(128, 128, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#d9dcdf';
      ctx.lineWidth = 6;
      for (let i = 0; i <= 4; i++) {
        const p = i * 32;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
      }
    });

    // --- Sign / nameplate generator
    function plateTex(lines, o = {}) {
      const w = o.w || 512, h = o.h || 128;
      return canvasTex(w, h, (ctx) => {
        ctx.fillStyle = o.bg || '#1b2533';
        ctx.fillRect(0, 0, w, h);
        if (o.border) { ctx.strokeStyle = o.border; ctx.lineWidth = o.borderW || 8; ctx.strokeRect(4, 4, w - 8, h - 8); }
        ctx.fillStyle = o.fg || '#e2e8f0';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const size = o.size || 44;
        lines.forEach((l, i) => {
          ctx.font = (i === 0 ? 'bold ' : '600 ') + (i === 0 ? size : size * 0.62) + 'px "Segoe UI", Arial, sans-serif';
          const yy = h / 2 + (i - (lines.length - 1) / 2) * size * 1.05;
          ctx.fillText(l, w / 2, yy);
        });
      });
    }
    function decal(tex, w, h, mat = {}) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial(Object.assign({
        map: tex, roughness: 0.45, metalness: 0.0,
        polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
      }, mat)));
      m.userData.noCast = true;
      return m;
    }
    const warnTriTex = canvasTex(128, 128, (ctx) => {
      ctx.clearRect(0, 0, 128, 128);
      ctx.fillStyle = '#f2c200'; ctx.strokeStyle = '#111'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(64, 8); ctx.lineTo(122, 116); ctx.lineTo(6, 116); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.moveTo(70, 34); ctx.lineTo(50, 74); ctx.lineTo(64, 74); ctx.lineTo(56, 104); ctx.lineTo(80, 62); ctx.lineTo(66, 62); ctx.lineTo(74, 34); ctx.closePath(); ctx.fill();
    });

    // =====================================================================
    // Materials
    // =====================================================================
    const glassMats = [];   // switched between physical transmission and cheap transparency by quality
    const M = {
      alu: new THREE.MeshStandardMaterial({ color: 0xc7ccd3, metalness: 1.0, roughness: 0.4, roughnessMap: brushedRough }),
      steel: new THREE.MeshStandardMaterial({ color: 0xb5bac1, metalness: 1.0, roughness: 0.3 }),
      darkSteel: new THREE.MeshStandardMaterial({ color: 0x4a4f57, metalness: 0.9, roughness: 0.45 }),
      chrome: new THREE.MeshStandardMaterial({ color: 0xf4f6f8, metalness: 1.0, roughness: 0.07 }),
      paintGrey: new THREE.MeshStandardMaterial({ color: 0xc9ccc8, metalness: 0.0, roughness: 0.5, normalMap: peelNormal, normalScale: new THREE.Vector2(0.18, 0.18) }),
      paintDark: new THREE.MeshStandardMaterial({ color: 0x30353c, metalness: 0.1, roughness: 0.55, normalMap: peelNormal, normalScale: new THREE.Vector2(0.18, 0.18) }),
      paintBlue: new THREE.MeshStandardMaterial({ color: 0x1d5f9e, metalness: 0.05, roughness: 0.42, normalMap: peelNormal, normalScale: new THREE.Vector2(0.18, 0.18) }),
      motorGrey: new THREE.MeshStandardMaterial({ color: 0x5b6672, metalness: 0.2, roughness: 0.5, normalMap: peelNormal, normalScale: new THREE.Vector2(0.25, 0.25) }),
      yellow: new THREE.MeshStandardMaterial({ color: 0xe0a800, metalness: 0.05, roughness: 0.5, normalMap: peelNormal, normalScale: new THREE.Vector2(0.18, 0.18) }),
      rubber: new THREE.MeshStandardMaterial({ color: 0x18191b, metalness: 0.0, roughness: 0.88 }),
      plasticBlack: new THREE.MeshStandardMaterial({ color: 0x15171a, metalness: 0.0, roughness: 0.48 }),
      uhmw: new THREE.MeshStandardMaterial({ color: 0xe9ebe6, metalness: 0.0, roughness: 0.62 }),
      cable: new THREE.MeshStandardMaterial({ color: 0x1a1c1f, metalness: 0.0, roughness: 0.6 }),
      cableOrange: new THREE.MeshStandardMaterial({ color: 0xd8640f, metalness: 0.0, roughness: 0.55 }),
      puHose: new THREE.MeshPhysicalMaterial({ color: 0x1f7ad6, metalness: 0.0, roughness: 0.3, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
      polycarb: new THREE.MeshPhysicalMaterial({ color: 0xaab4bf, metalness: 0.0, roughness: 0.06, transmission: 1.0, thickness: 0.008, ior: 1.585 }),
      floorPaintYellow: new THREE.MeshStandardMaterial({ color: 0xe5b200, roughness: 0.55, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }),
      floorPaintGreen: new THREE.MeshStandardMaterial({ color: 0x4f6b58, roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }),

    const profileShapeCache = new Map();
    function slotProfileShape(s) {
      if (profileShapeCache.has(s)) return profileShapeCache.get(s);
      const h = s / 2, sw = s * 0.15, sd = s * 0.2;
      const pts = [
        [-h, -h], [-sw, -h], [-sw, -h + sd], [sw, -h + sd], [sw, -h], [h, -h],
        [h, -sw], [h - sd, -sw], [h - sd, sw], [h, sw], [h, h],
        [sw, h], [sw, h - sd], [-sw, h - sd], [-sw, h], [-h, h],
        [-h, sw], [-h + sd, sw], [-h + sd, -sw], [-h, -sw]
      ];
      const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
      const hole = new THREE.Path();
      hole.absarc(0, 0, s * 0.09, 0, Math.PI * 2, true);
      shape.holes.push(hole);
      profileShapeCache.set(s, shape);
      return shape;
    }
    function profileBar(len, axis, s = 0.045, mat = M.alu) {
      const geo = new THREE.ExtrudeGeometry(slotProfileShape(s), { depth: len, bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.0015, bevelSegments: 1, curveSegments: 6 });
      geo.translate(0, 0, -len / 2);
      if (axis === 'x') geo.rotateY(Math.PI / 2);
      if (axis === 'y') geo.rotateX(Math.PI / 2);
      return new THREE.Mesh(geo, mat);
    }
    function box(w, h, d, mat, r = 0) {
      const geo = r > 0 ? new RoundedBoxGeometry(w, h, d, 3, r) : new THREE.BoxGeometry(w, h, d);
      return new THREE.Mesh(geo, mat);
    }
    function cyl(rt, rb, h, mat, seg = 24, axis = 'y') {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
      if (axis === 'x') m.rotation.z = Math.PI / 2;
      if (axis === 'z') m.rotation.x = Math.PI / 2;
      return m;
    }
    function tube(points, r, mat, seg = 32) {
      const curve = new THREE.CatmullRomCurve3(points);
      return new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 8, false), mat);
    }
    function sagCable(a, b, sag, r = 0.012, mat = M.cable) {
      const mid = a.clone().lerp(b, 0.5); mid.y -= sag;
      const q1 = a.clone().lerp(mid, 0.5); q1.y -= sag * 0.35;
      const q2 = mid.clone().lerp(b, 0.5); q2.y -= sag * 0.35;
      const t = tube([a, q1, mid, q2, b], r, mat, 40);
      t.userData.noCast = r < 0.015;
      return t;
    }

    // =====================================================================

    function buildImpeller() {
      const g = new THREE.Group();
      const V2 = (x, y) => new THREE.Vector2(x, y);
      const back = new THREE.Mesh(new THREE.LatheGeometry([V2(0.034, 0), V2(0.195, 0), V2(0.2, 0.006), V2(0.2, 0.02), V2(0.075, 0.036), V2(0.034, 0.036), V2(0.034, 0)], 64), PART_MATS.castIron);
      g.add(back);
      const hub = new THREE.Mesh(new THREE.LatheGeometry([V2(0.034, 0.036), V2(0.066, 0.036), V2(0.06, 0.13), V2(0.034, 0.13), V2(0.034, 0.036)], 48), PART_MATS.machined);
      g.add(hub);
      const bore = cyl(0.033, 0.033, 0.14, PART_MATS.bore, 24); bore.position.y = 0.068;
      g.add(bore);
      const bladeShape = new THREE.Shape();
      const N = 12, r0 = 0.07, r1 = 0.192, sweep = 1.05, th = 0.011;
      const outer = [], inner = [];
      for (let i = 0; i <= N; i++) {
        const t = i / N, r = r0 + (r1 - r0) * t, a = sweep * t;
        outer.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
        const ai = a + th / r;
        inner.push(new THREE.Vector2(Math.cos(ai) * r, Math.sin(ai) * r));
      }
      bladeShape.setFromPoints(outer.concat(inner.reverse()));
      const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, { depth: 0.07, bevelEnabled: false, curveSegments: 4 });
      bladeGeo.rotateX(-Math.PI / 2);
      for (let i = 0; i < 6; i++) {
        const b = new THREE.Mesh(bladeGeo, PART_MATS.castIron);
        b.rotation.y = (i / 6) * Math.PI * 2;
        b.position.y = 0.02;
        g.add(b);
      }
      const front = new THREE.Mesh(new THREE.LatheGeometry([V2(0.105, 0.112), V2(0.2, 0.088), V2(0.2, 0.1), V2(0.11, 0.124), V2(0.1, 0.13), V2(0.105, 0.112)], 64), PART_MATS.castIron);
      g.add(front);
      const eyeRing = new THREE.Mesh(new THREE.LatheGeometry([V2(0.1, 0.13), V2(0.11, 0.124), V2(0.112, 0.15), V2(0.1, 0.15), V2(0.1, 0.13)], 48), PART_MATS.machined);
      g.add(eyeRing);
      return g;
    }

    function buildVial() {

    function pcbMaps() {
      const W = 512, H = 390;
      const draw = (mode) => (ctx) => {
        const fill = (c, m, r) => mode === 'color' ? c : mode === 'metal' ? m : r;
        ctx.fillStyle = fill('#0e5a34', '#000', '#5a5a5a'); ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = fill('#1a7445', '#000', '#4a4a4a'); ctx.lineWidth = 4; ctx.lineCap = 'round';
        let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
        for (let i = 0; i < 46; i++) {
          let x = rnd() * W, y = rnd() * H;
          ctx.beginPath(); ctx.moveTo(x, y);
          for (let k = 0; k < 3; k++) { if (rnd() > 0.5) x += (rnd() - 0.5) * 220; else y += (rnd() - 0.5) * 220; ctx.lineTo(x, y); }
          ctx.stroke();
        }
        ctx.fillStyle = fill('#d9b45a', '#fff', '#3a3a3a');
        for (let i = 0; i < 12; i++) { ctx.fillRect(196 + i * 10, 112, 5, 18); ctx.fillRect(196 + i * 10, 250, 5, 18); ctx.fillRect(176, 132 + i * 10, 18, 5); ctx.fillRect(316, 132 + i * 10, 18, 5); }
        [[60, 60], [60, 110], [60, 160], [420, 70], [420, 120], [430, 300], [90, 300], [150, 330]].forEach(([x, y]) => { ctx.fillRect(x, y, 10, 12); ctx.fillRect(x + 22, y, 10, 12); });
        for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.arc(130 + i * 26, 360, 8, 0, Math.PI * 2); ctx.fill(); }
        for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.arc(rnd() * W, rnd() * H, 4, 0, Math.PI * 2); ctx.fill(); }
        [[22, 22], [W - 22, 22], [22, H - 22], [W - 22, H - 22]].forEach(([x, y]) => {
          ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = fill('#0a0a0a', '#000', '#ffffff'); ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = fill('#d9b45a', '#fff', '#3a3a3a');
        });
        if (mode !== 'metal') {
          ctx.fillStyle = fill('#f1f1ea', '#000', '#9a9a9a'); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2;
          ctx.font = 'bold 18px Arial'; ctx.fillText('VSC-PCB300 REV B', 300, 30);
          ctx.font = '13px Arial';
          ctx.fillText('U1', 240, 105); ctx.fillText('R1', 52, 55); ctx.fillText('R2', 52, 105); ctx.fillText('C1', 52, 155); ctx.fillText('C7', 412, 65); ctx.fillText('J1', 100, 345); ctx.fillText('C12', 380, 230);
          ctx.strokeRect(170, 106, 172, 168);
          ctx.beginPath(); ctx.arc(410, 250, 32, 0, Math.PI * 2); ctx.stroke();
        }
      };
      const maps = {
        map: canvasTex(W, H, draw('color'), true),
        metalnessMap: canvasTex(W, H, draw('metal'), false),
        roughnessMap: canvasTex(W, H, draw('rough'), false)
      };
      Object.values(maps).forEach(t => { t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; });
      return maps;
    }
    let pcbMapsCache = null;
    function buildPCB() {
      const g = new THREE.Group();
      const BW = 0.42, BD = 0.32, BT = 0.016;
      pcbMapsCache = pcbMapsCache || pcbMaps();
      const top = new THREE.MeshStandardMaterial({ map: pcbMapsCache.map, metalnessMap: pcbMapsCache.metalnessMap, roughnessMap: pcbMapsCache.roughnessMap, metalness: 1, roughness: 1 });

      const board = new THREE.Mesh(new THREE.BoxGeometry(BW, BT, BD), [edge, edge, top, edge, edge, edge]);

      const pallet = box(BW + 0.04, 0.004, BD + 0.04, new THREE.MeshStandardMaterial({ color: 0x2b3038, roughness: 0.6 }));
      pallet.position.y = 0.002;
      g.add(pallet);
      const Y = BT + 0.004;
      const px = u => (u / 512 - 0.5) * BW, pz = v => (v / 390 - 0.5) * BD;
      const qfp = box(0.06, 0.008, 0.06, PART_MATS.chipBody, 0.002); qfp.position.set(px(256), Y + 0.004, pz(190));
      g.add(qfp);
      const leads = [];
      for (let i = 0; i < 12; i++) {
        const o = -0.0275 + i * 0.005;
        [[o, -0.034, 0.0015, 0.008], [o, 0.034, 0.0015, 0.008], [-0.034, o, 0.008, 0.0015], [0.034, o, 0.008, 0.0015]].forEach(([dx, dz, w, d]) => {
          const lg = new THREE.BoxGeometry(w, 0.0015, d); lg.translate(px(256) + dx, Y + 0.002, pz(190) + dz); leads.push(lg);
        });
      }
      g.add(new THREE.Mesh(mergeGeometries(leads), PART_MATS.tin));
      const bodies = [], caps = [], ends = [];
      [[60, 60, 'r'], [60, 110, 'r'], [60, 160, 'c'], [420, 70, 'c'], [420, 120, 'r'], [430, 300, 'c'], [90, 300, 'r'], [150, 330, 'c']].forEach(([u, v, t]) => {

      });
      g.add(new THREE.Mesh(mergeGeometries(bodies), PART_MATS.resistor));
      g.add(new THREE.Mesh(mergeGeometries(caps), PART_MATS.ceramic));
      g.add(new THREE.Mesh(mergeGeometries(ends), PART_MATS.tin));
      const ec = cyl(0.026, 0.026, 0.05, PART_MATS.elcapSleeve, 32); ec.position.set(px(410), Y + 0.025, pz(250));
      const ecTop = cyl(0.025, 0.025, 0.002, PART_MATS.elcap, 32); ecTop.position.set(px(410), Y + 0.0505, pz(250));
      g.add(ec, ecTop);
      const hdr = box(0.17, 0.01, 0.022, PART_MATS.header, 0.002); hdr.position.set(px(221), Y + 0.005, pz(360));
      g.add(hdr);
      const pins = [];
      for (let i = 0; i < 8; i++) { const p = new THREE.BoxGeometry(0.0025, 0.024, 0.0025); p.translate(px(130 + i * 26), Y + 0.018, pz(360)); pins.push(p); }
      g.add(new THREE.Mesh(mergeGeometries(pins), PART_MATS.gold));

      g.add(xtal);
      return g;
    }

    const PART_BUILDERS = { CAST_100: buildImpeller, PACK_200: buildVial, PCB_300: buildPCB };
    const RECIPE_ALIAS = { PCB_500: 'PCB_300' };
    const PART_RADIUS = { CAST_100: 0.2, PACK_200: 0.11, PCB_300: 0.27 };
    const partTemplates = {};

    const MODEL_DIR = '/static/models/';

    const gltfLoader = new GLTFLoader();
    function tryLoadModel(file, apply) {
      return new Promise(resolve => {
        gltfLoader.load(MODEL_DIR + file, gltf => {
          const root = gltf.scene;
          shadowSet(root);
          try { apply(root); resolve(true); } catch (e) { resolve(false); }
        }, undefined, () => resolve(false));
      });
    }
    function fitPart(group, maxDim) {
      const b = new THREE.Box3().setFromObject(group);
      const size = b.getSize(new THREE.Vector3());
      const s = maxDim / Math.max(size.x, size.y, size.z, 0.001);
      const c = b.getCenter(new THREE.Vector3());
      group.scale.setScalar(s);
      group.position.set(-c.x * s, -b.min.y * s, -c.z * s);
      const wrap = new THREE.Group();
      wrap.add(group);
      return wrap;
    }

    function normRecipe(r) { return RECIPE_ALIAS[r] || r; }
    function createPartMesh(recipe) {
      recipe = normRecipe(recipe);
      let tpl = partModels[recipe];
      if (!tpl) {
        if (!partTemplates[recipe]) {
          const builder = PART_BUILDERS[recipe] || buildPCB;
          partTemplates[recipe] = builder();
          shadowSet(partTemplates[recipe]);
        }
        tpl = partTemplates[recipe];
      }
      const g = new THREE.Group();
      g.add(tpl.clone());
      return g;
    }

      ring.rotation.x = -Math.PI / 2;

    (async () => {

      if (await tryLoadModel(MODEL_FILES.gantry, root => { scene.remove(gantryProc); scene.add(root); })) loaded.push(MODEL_FILES.gantry);

    async function pollState() {
      try {
        const res = await fetch('/api/state');
        liveState = await res.json();
        pollTime = performance.now();
        const conv = liveState.udts.UDT_ConveyorAxis;
        const cam = liveState.udts.UDT_VisionCamera;
        const batch = liveState.udts.UDT_ProductionBatch;
        const rej = liveState.udts.UDT_RejectActuator || {};

        document.getElementById('hudRecipe').textContent = batch.Active_Recipe;
        document.getElementById('hudEncoder').textContent = conv.Encoder_mm.toFixed(0);
        document.getElementById('hudSpeed').textContent = conv.Actual_PPM.toFixed(0);
        document.getElementById('hudFifo').textContent = conv.FIFO_Queue_Depth;
        document.getElementById('hudBin').textContent = (rej.Bin_Count ?? 0) + '/' + (rej.Bin_Capacity ?? 25);
        document.getElementById('hudEdgeMs').textContent = cam.Last_Edge_Latency_ms.toFixed(1) + ' ms';
        document.getElementById('hudCloudMs').textContent = cam.Last_Cloud_Latency_ms.toFixed(0) + ' ms';
        document.getElementById('hudSerial').textContent = cam.Last_Serial;
        const stEl = document.getElementById('hudStatus');
        stEl.textContent = cam.Last_Status + ' (' + cam.Last_Defect_Class + ')';
        stEl.className = 'hud-badge ' + (cam.Last_Status === 'OK' ? 'ok' : 'nok');

        if (cam.Last_Serial !== lastKnownSerial) {
          lastKnownSerial = cam.Last_Serial;
          flash = 1;
          if (cam.Last_Status === 'NOK') nokSince = performance.now();
          drawHMI({
            recipe: batch.Active_Recipe, serial: cam.Last_Serial, ppm: conv.Actual_PPM.toFixed(0),
            edge: cam.Last_Edge_Latency_ms.toFixed(1) + ' ms', status: cam.Last_Status,
            defect: cam.Last_Defect_Class, running: conv.Running_FB
          });
        }
      } catch (e) { /* backend offline: keep last frame */ }
    }
    setInterval(pollState, 350);
    pollState();

    // =====================================================================
    // Part life-cycle on the belt → pusher → chute → tote
    // =====================================================================
    const beltParts = new Map();
    const binParts = { reject: [], ok: [] };
    let pusherKick = -1e9;
    const easeOut = t => 1 - Math.pow(1 - t, 3);
    const easeIn = t => t * t;
    const linear = t => t;

    function binSlot(bin, n) {
      const perRow = 3, perLayer = 6;
      const layer = Math.floor(n / perLayer), k = n % perLayer;
      const cx = (k % perRow - 1) * (bin.w * 0.28) + (Math.random() - 0.5) * 0.06;
      const cz = (Math.floor(k / perRow) - 0.5) * (bin.d * 0.38) + (Math.random() - 0.5) * 0.06;
      return new THREE.Vector3(bin.x + cx, 0.05 + layer * 0.09, bin.z + cz);
    }
    function startFlight(p, keyframes) {
      p.mode = 'flight';
      p.frames = keyframes;
      p.fi = 0; p.ft = 0;
      p.from = p.mesh.position.clone();
      p.spin = new THREE.Vector3((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 6);
      if (p.marker) { p.mesh.remove(p.marker); p.marker = null; }
    }
    function settle(p, kind) {
      p.mode = 'settled';
      const list = binParts[kind];
      list.push(p.mesh);
      const cap = kind === 'reject' ? 25 : 24;
      while (list.length > cap) scene.remove(list.shift());
    }
    function syncRejectBin() {
      const count = liveState?.udts?.UDT_RejectActuator?.Bin_Count;
      if (typeof count === 'number' && count < binParts.reject.length) {
        while (binParts.reject.length > count) scene.remove(binParts.reject.shift());
      }
    }

    function updateParts(dt, now) {
      const conv = liveState?.udts?.UDT_ConveyorAxis;
      const running = conv?.Running_FB ?? false;
      const speed = running ? (conv?.Belt_Speed_mm_s ?? 0) : 0;
      const elapsed = Math.min(1.0, (now - pollTime) / 1000);
      const fifo = liveState?.fifo_queue || [];
      const seen = new Set();

      fifo.forEach(item => {
        const sn = item.serial_number;
        seen.add(sn);
        let p = beltParts.get(sn);
        if (!p) {
          if (item.actuated && item.plc_action && item.plc_action !== 'PASS_CONVEYOR') return; // already rejected before page load
          const recipe = normRecipe(item.product_recipe);
          const mesh = createPartMesh(recipe);
          mesh.rotation.y = Math.random() * Math.PI * 2;
          const marker = makeMarker(item.edge_status, PART_RADIUS[recipe] || 0.22);
          mesh.add(marker);
          mesh.position.set(mmToX(item.pos_mm), BELT_TOP, 0);
          scene.add(mesh);
          p = { mesh, marker, recipe, status: item.edge_status, mode: 'belt' };
          beltParts.set(sn, p);
        }
        if (p.mode !== 'belt') return;
        const predMm = Math.min(1450, item.pos_mm + speed * elapsed);
        const tx = mmToX(predMm);
        p.mesh.position.x += (tx - p.mesh.position.x) * Math.min(1, dt * 12);
        p.mesh.position.y = BELT_TOP;
        if (item.actuated && item.plc_action && item.plc_action !== 'PASS_CONVEYOR') {
          pusherKick = now;
          const x = PUSHER_X + (Math.random() - 0.5) * 0.1;
          const n = binParts.reject.length;
          startFlight(p, [
            { pos: new THREE.Vector3(x, BELT_TOP, CHUTE_Z0 + 0.05), dur: 0.16, ease: easeOut },
            { pos: new THREE.Vector3(x, CHUTE_Y1 + 0.02, CHUTE_Z1), dur: 0.32, ease: easeIn, tilt: chuteAng },
            { pos: binSlot(REJECT_BIN, n), dur: 0.28, ease: easeIn, spin: true }
          ]);
          p.binKind = 'reject';
        }
      });

      for (const [sn, p] of beltParts.entries()) {
        if (p.mode === 'belt' && !seen.has(sn)) {
          const n = binParts.ok.length;
          const v = Math.max(0.5, speed * MM_TO_UNITS || 1.5);
          startFlight(p, [
            { pos: new THREE.Vector3(BELT_HALF_LEN + 0.05, BELT_TOP, p.mesh.position.z), dur: Math.max(0.05, (BELT_HALF_LEN + 0.05 - p.mesh.position.x) / v), ease: linear },
            { pos: new THREE.Vector3(BELT_HALF_LEN + 0.42, BELT_TOP - 0.25, 0), dur: 0.2, ease: easeIn, tilt: 0.45, tiltAxis: 'z' },
            { pos: binSlot(OK_BIN, n), dur: 0.3, ease: easeIn, spin: true }
          ]);
          p.binKind = 'ok';
        }
        if (p.mode === 'flight') {
          const f = p.frames[p.fi];
          p.ft += dt;
          const t = Math.min(1, p.ft / f.dur);
          p.mesh.position.lerpVectors(p.from, f.pos, f.ease(t));
          if (f.spin) {
            p.mesh.rotation.x += p.spin.x * dt; p.mesh.rotation.z += p.spin.z * dt; p.mesh.rotation.y += p.spin.y * dt;
          } else if (f.tilt !== undefined) {
            if (f.tiltAxis === 'z') p.mesh.rotation.z += (-f.tilt - p.mesh.rotation.z) * Math.min(1, dt * 12);
            else p.mesh.rotation.x += (f.tilt - p.mesh.rotation.x) * Math.min(1, dt * 12);
          }
          if (t >= 1) {
            p.from = f.pos.clone(); p.ft = 0; p.fi++;
            if (p.fi >= p.frames.length) {
              p.mesh.rotation.set((Math.random() - 0.5) * 0.9, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.9);
              settle(p, p.binKind);
              beltParts.delete(sn);
            }
          }
        }
      }
      syncRejectBin();
    }

    // =====================================================================
    // Post-processing (GTAO + bloom + SMAA) and quality presets
    // =====================================================================
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const gtaoPass = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
    gtaoPass.output = GTAOPass.OUTPUT.Default;
    gtaoPass.blendIntensity = 0.9;
    gtaoPass.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.5, thickness: 1.2, scale: 1.0, samples: 16, distanceFallOff: 1.0 });
    gtaoPass.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
    composer.addPass(gtaoPass);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.35, 0.45, 1.05);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
    const smaaPass = new SMAAPass(window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio());
    composer.addPass(smaaPass);

    const QUALITY = {
      high: { label: 'Alta', pr: () => Math.min(window.devicePixelRatio, 2), shadow: 2048, ao: true, bloom: true, glass: true },
      low: { label: 'Baja', pr: () => 1, shadow: 1024, ao: false, bloom: true, glass: false }
    };
    let quality = 'high';
    let userChoseQuality = false;
    try {
      const saved = localStorage.getItem('vscada_cell3d_quality');
      if (saved === 'high' || saved === 'low') { quality = saved; userChoseQuality = true; }
    } catch (e) { /* storage blocked */ }

    function applyQuality(q) {
      quality = q;
      const Q = QUALITY[q];
      renderer.setPixelRatio(Q.pr());
      composer.setPixelRatio(Q.pr());
      composer.setSize(window.innerWidth, window.innerHeight);
      if (keyLight.shadow.mapSize.x !== Q.shadow) {
        keyLight.shadow.mapSize.set(Q.shadow, Q.shadow);
        if (keyLight.shadow.map) { keyLight.shadow.map.dispose(); keyLight.shadow.map = null; }
      }
      gtaoPass.enabled = Q.ao;
      aoDecals.forEach(d => { d.visible = !Q.ao; });
      bloomPass.enabled = Q.bloom;
      glassMats.forEach(m => {
        if (m.userData.baseTransmission === undefined) m.userData.baseTransmission = m.transmission;
        m.transmission = Q.glass ? m.userData.baseTransmission : 0;
        m.transparent = !Q.glass;
        m.opacity = Q.glass ? 1 : 0.35;
        m.depthWrite = Q.glass;
        m.needsUpdate = true;
      });
      document.getElementById('qualityBtn').textContent = 'Calidad: ' + Q.label;
    }
    function setQuality(q, byUser) {
      if (byUser) {
        userChoseQuality = true;
        try { localStorage.setItem('vscada_cell3d_quality', q); } catch (e) { /* ignore */ }
      }
      applyQuality(q);
    }
    applyQuality(quality);
    document.getElementById('qualityBtn').addEventListener('click', () => setQuality(quality === 'high' ? 'low' : 'high', true));
    window.addEventListener('keydown', e => {
      if (e.key === 'r' || e.key === 'R') toggleAutoRotate();
      if (e.key === 'q' || e.key === 'Q') setQuality(quality === 'high' ? 'low' : 'high', true);
    });
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    // =====================================================================
    // Animation loop
    // =====================================================================
    const clock = new THREE.Clock();
    let beltOffset = 0, pusherExt = 0;
    let fpsFrames = 0, fpsT0 = performance.now(), slowWindows = 0;
    let firstFrame = true;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());
      const now = performance.now();
      const t = now / 1000;
      controls.update();

      const conv = liveState?.udts?.UDT_ConveyorAxis;
      const running = conv?.Running_FB ?? false;
      const vUnits = running ? (conv?.Belt_Speed_mm_s ?? 0) * MM_TO_UNITS : 0;

      beltOffset -= vUnits * dt;
      beltMatTop.map.offset.x = beltOffset;
      beltMatTop.normalMap.offset.x = beltOffset;
      drums.forEach(d => { d.rotation.y -= (vUnits / DRUM_R) * dt; });

      flash = Math.max(0, flash - dt * 9);
      ringLedMat.emissiveIntensity = 2.0 + 22 * flash;
      tunnelLight.intensity = 6 + 60 * flash;

      const lastStatus = liveState?.udts?.UDT_VisionCamera?.Last_Status;
      const recentNok = lastStatus === 'NOK' && (now - nokSince) < 3000;
      const blink = Math.sin(t * 9) > 0 ? 1 : 0;
      stackMats.green.emissiveIntensity = running && !recentNok ? 4 : 0.05;
      stackMats.red.emissiveIntensity = recentNok ? (blink ? 6 : 0.1) : 0.05;
      stackMats.amber.emissiveIntensity = !running ? 4 : 0.05;
      statusLedMats[0].emissiveIntensity = running ? 2.5 : 0.05;
      statusLedMats[1].emissiveIntensity = flash > 0.2 ? 3 : 0.05;
      statusLedMats[2].emissiveIntensity = recentNok && blink ? 3 : 0.05;

      const solenoid = liveState?.udts?.UDT_RejectActuator?.Solenoid_Active ?? false;
      const target = (solenoid || now - pusherKick < 260) ? 1 : 0;
      pusherExt += (target - pusherExt) * Math.min(1, dt * (target ? 30 : 14));
      const plateZ = PLATE_RETRACT + (PLATE_EXTEND - PLATE_RETRACT) * pusherExt;
      pusherHead.position.z = plateZ - 0.035;
      pistonRod.scale.z = Math.max(0.01, (plateZ - 0.05) - (CYL_FRONT + 0.01));
      valveLedMat.emissiveIntensity = target ? 4 : 0.05;
      peLedMat.emissiveIntensity = flash > 0.5 ? 6 : 1.5;

      updateParts(dt, now);
      composer.render();

      if (firstFrame) {
        firstFrame = false;
        const l = document.getElementById('loading');
        l.style.opacity = '0';
        setTimeout(() => l.remove(), 600);
      }

      fpsFrames++;
      if (now - fpsT0 > 4000) {
        const fps = fpsFrames * 1000 / (now - fpsT0);
        fpsFrames = 0; fpsT0 = now;
        if (quality === 'high' && !userChoseQuality) {
          slowWindows = fps < 28 ? slowWindows + 1 : 0;
          if (slowWindows >= 2) { applyQuality('low'); toast('Calidad reducida automáticamente (' + fps.toFixed(0) + ' FPS). Pulsa Q para volver a Alta.'); }
        }
      }
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // Hook for automated screenshots / debugging
    window.__cell3d = { setQuality: q => { userChoseQuality = true; applyQuality(q); }, camera, controls, info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, progs: renderer.info.programs.length }) };
  </script>
</body>
</html>
